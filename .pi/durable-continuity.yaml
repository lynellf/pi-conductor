          - tests/host/child-result.test.ts
          - tests/host/issue-112-legacy-delegate-race.test.ts
          - tests/host/continuity-child-observation.test.ts
          - tests/host/continuity-child-restart.test.ts
          - tests/persistence/continuity-child-completion.test.ts

  - name: continuity-ledger-worker
    models:
      - model: minimax:MiniMax-M2.7
        effort: high
      - model: openai-codex:gpt-5.6-terra
        effort: high
