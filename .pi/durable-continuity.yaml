        effort: high
    max_session_cost_usd: 14
    system_prompt: ./subagents/durable-continuity/continuity-ledger-worker.md
    completion_protocol: report_result
    workspace:
      projection:
        required: true
        allowed_paths:
          - AGENTS.md
          - docs/archive/orchestrator-fsm-spec.md
          - docs/durable-continuity/spec.md
          - docs/durable-continuity/plan.md
          - docs/durable-continuity/tasks/parent-packet.md
          - src/core/types.ts
          - src/seam/continuity.ts
          - src/seam/schema.ts
          - src/manifest/continuity.ts
          - src/manifest/parse.ts
          - src/manifest/types.ts
          - src/persistence/continuity.ts
          - src/persistence/continuity-materialization.ts
          - src/persistence/continuity-render.ts
          - src/persistence/log.ts
          - src/persistence/record-materialization.ts
          - src/persistence/trajectory-records.ts
          - src/persistence/delegation-lifecycle-schema.ts
          - src/bin/cli-main.ts
          - src/bin/cli-ui.ts
          - src/bin/cli-reconcile.ts
